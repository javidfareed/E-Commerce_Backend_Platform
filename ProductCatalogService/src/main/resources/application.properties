spring.application.name=ProductCatalogService
groq.api-key=${GROQ_API_KEY}
groq.url=https://api.groq.com/openai/v1/chat/completions

spring.datasource.url=jdbc:mysql://localhost:3306/productcatalogservice
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

resilience4j.circuitbreaker.instances.groq.sliding-window-size=5
resilience4j.circuitbreaker.instances.groq.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.groq.permitted-number-of-calls-in-half-open-state=3
management.endpoints.web.exposure.include=health,circuitbreakers
