name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: productcatalogservice_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    defaults:
      run:
        working-directory: ProductCatalogService

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests and JaCoCo report
        run: |
          chmod +x mvnw
          ./mvnw -B clean test -Dtest='!ProductCatalogServiceApplicationTests,!ProductSearchIntegrationTest'
          

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: ProductCatalogService/target/site/jacoco/
          if-no-files-found: warn
