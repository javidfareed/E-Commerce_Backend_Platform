name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ProductCatalogService

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests and JaCoCo report
        run: |
          chmod +x mvnw
          ./mvnw -B clean test -Dtest='!ProductCatalogServiceApplicationTests,!ProductSearchIntegrationTest'
          

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: ProductCatalogService/target/site/jacoco/
          if-no-files-found: warn
